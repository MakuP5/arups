<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Test AR con cambio de modelos</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html, body { height:100%; margin:0; background:#111; display:flex; flex-direction:column; }
    model-viewer { width:100%; height:100%; flex:1; }
    .botones {
      display:flex;
      justify-content:center;
      gap:10px;
      padding:10px;
      background:#000;
    }
    button {
      padding:10px 20px;
      border:none;
      background:#444;
      color:white;
      font-weight:bold;
      border-radius:5px;
      cursor:pointer;
    }
    button:hover {
      background:#666;
    }
  </style>
</head>
<body>

  <!-- 🔘 BOTONES PARA CAMBIAR MODELO -->
  <div class="botones">
    <button onclick="cambiarModelo('torax.glb', 'torax.usdz')">Modelo 1</button>
    <button onclick="cambiarModelo('craneo.glb', 'craneo.usdz')">Modelo 2</button>
    <button onclick="cambiarModelo('pelvis.glb', 'pelvis.usdz')">Modelo 3</button>
  </div>

  <!-- 👇 VISOR MODEL-VIEWER -->
  <model-viewer
    id="visor"
    src="torax.glb"
    ios-src="torax.usdz"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    alt="Modelo en 3D">
  </model-viewer>

  <!-- ⭐ SCRIPT PARA CAMBIO DE MODELO -->
  <script>
    function cambiarModelo(src, iosSrc) {
      const visor = document.getElementById('visor');
      visor.src = src;
      visor.setAttribute("ios-src", iosSrc);
    }
  </script>

</body>
</html>
